services:
  - type: web
    name: greenhouse-api
    env: node
    plan: free
    region: singapore
    buildCommand: (corepack enable || npm install -g pnpm) && pnpm install --no-frozen-lockfile --prod=false && pnpm --filter=@homemate/api... build
    startCommand: node apps/api/dist/apps/api/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: homemate
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 100
      - key: FEATURE_AI_ASSISTANT
        value: false
      - key: FEATURE_MOCK_PAYMENT
        value: true
